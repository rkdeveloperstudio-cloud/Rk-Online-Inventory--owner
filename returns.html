<!DOCTYPE html>
<html>

<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>
Return Sales
</title>


<style>

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}



html,
body{

    width:100%;
    min-height:100%;

    margin:0;

}



body{

    min-height:100dvh;

    overflow-x:hidden;


    font-family:
    "Segoe UI",
    Arial,
    sans-serif;



    padding:15px;



    background:

    linear-gradient(
        135deg,
        #4f46e5,
        #6d28d9,
        #2563eb,
        #06b6d4
    );


    background-size:300% 300%;


    animation:
    gradientMove 12s ease infinite;


}



@keyframes gradientMove{


0%{
    background-position:0% 50%;
}


50%{
    background-position:100% 50%;
}


100%{
    background-position:0% 50%;
}


}





/* BUTTONS */


button{


    width:100%;


    padding:16px;


    margin:10px 0;


    font-size:17px;


    font-weight:bold;



    border:none;


    border-radius:16px;


    color:white;


    cursor:pointer;



    background:

    rgba(255,255,255,.18);



    backdrop-filter:

    blur(12px);



    -webkit-backdrop-filter:

    blur(12px);



    border:

    1px solid rgba(255,255,255,.25);



    box-shadow:


    0 10px 25px rgba(0,0,0,.20),


    inset 0 1px 1px rgba(255,255,255,.25);



    transition:.3s;


}



button:hover{


    transform:

    translateY(-3px);



    background:

    rgba(255,255,255,.30);



    box-shadow:


    0 15px 35px rgba(0,0,0,.25);


}



button:active{


    transform:

    scale(.97);


}






.container{

    width:100%;

    max-width:500px;

    margin:auto;

}





h3{


    text-align:center;


    color:white;


    font-size:30px;



    margin:20px 0;


    text-shadow:


    0 4px 10px rgba(0,0,0,.3),


    0 0 20px rgba(255,255,255,.4);



}







/* FILTER CARD */


.card{


    background:


    rgba(255,255,255,.14);



    backdrop-filter:

    blur(22px);



    -webkit-backdrop-filter:

    blur(22px);



    padding:20px;



    border-radius:25px;



    margin-top:15px;



    border:


    1px solid rgba(255,255,255,.25);



    box-shadow:


    0 25px 50px rgba(0,0,0,.25),


    inset 0 1px 1px rgba(255,255,255,.25);



}





label{


    display:block;


    font-weight:bold;


    margin-top:12px;


    color:white;



}






input,
select{


    width:100%;


    padding:14px;


    margin-top:6px;



    border:none;


    outline:none;


    border-radius:15px;


    font-size:16px;



    background:


    rgba(255,255,255,.90);



    box-shadow:


    inset 0 3px 8px rgba(0,0,0,.15);



}





/* RESULT */


.result{


    background:


    rgba(255,255,255,.14);



    backdrop-filter:

    blur(20px);



    -webkit-backdrop-filter:

    blur(20px);



    margin-top:20px;



    padding:15px;



    border-radius:25px;



    border:

    1px solid rgba(255,255,255,.25);



    box-shadow:


    0 20px 40px rgba(0,0,0,.25);



    overflow:hidden;


}



.result h3{


    color:white;


    font-size:22px;


    margin-top:0;


}







#returnList{


    width:100%;


    overflow-x:auto;


}






table{


    width:100%;


    border-collapse:collapse;


    background:

    rgba(255,255,255,.85);



    border-radius:15px;


    overflow:hidden;


}





th{


    background:

    linear-gradient(
        135deg,
        #667eea,
        #764ba2
    );


    color:white;


    padding:12px;


}





td{


    padding:10px;


    border-bottom:

    1px solid rgba(0,0,0,.1);


    font-size:14px;


    color:#333;


}





#status{


    margin-top:10px;


    padding:12px;



    text-align:center;



    border-radius:15px;



    background:


    rgba(255,255,255,.85);



    font-weight:bold;


}






@media(max-width:600px){


body{

    padding:12px;

}



.card{

    padding:16px;

}



h3{

    font-size:26px;

}



button{

    padding:15px;

}



}


</style>

</head>


<body>


<button onclick="location.href='index.html'">

← HOME

</button>



<button onclick="downloadReturns()">

⬇ DOWNLOAD

</button>

<div id="status">
</div>


<div class="card">


<label>
DATE FROM
</label>

<input 
type="date"
id="dateFrom">



<label>
DATE TO
</label>

<input 
type="date"
id="dateTo">



<label>
COUNTER NO
</label>


<select id="counterNo">

<option value="">
ALL
</option>


<option value="1">
1
</option>


<option value="2">
2
</option>


<option value="3">
3
</option>


<option value="4">
4
</option>


<option value="5">
5
</option>


<option value="6">
6
</option>


<option value="7">
7
</option>


<option value="8">
8
</option>


<option value="9">
9
</option>


<option value="10">
10
</option>


</select>



<button onclick="searchReturns()">

SEARCH

</button>


</div>




<div class="result">


<h3>
RESULT
</h3>


<div id="returnList">

</div>


</div>



<script src="returns.js"></script>


</body>

</html>
