<!DOCTYPE html>
<html>

<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>
Return Sales
</title>


<style>

*{
    box-sizing:border-box;
}


html,
body{

    width:100%;

    min-height:100%;

    margin:0;

}


html{

    background:
    linear-gradient(
        135deg,
        #667eea,
        #764ba2,
        #1976d2
    );

}


body{

    min-height:100dvh;

    overflow-x:hidden;

    overflow-y:auto;

    font-family:
    "Segoe UI",
    Arial,
    sans-serif;

    background:
    linear-gradient(
        135deg,
        #667eea,
        #764ba2,
        #1976d2
    );

}



.container{

    width:100%;

    max-width:500px;

    margin:auto;

}



h3{

    text-align:center;

    color:white;

    font-size:28px;

    margin:20px 0;

}




button{

    width:100%;

    padding:15px;

    margin:10px 0;


    font-size:17px;

    font-weight:bold;


    border:none;

    border-radius:15px;


    color:white;


    cursor:pointer;


    background:

    linear-gradient(
        135deg,
        #667eea,
        #764ba2
    );


    box-shadow:

    0 8px 20px rgba(0,0,0,.25);


    transition:.3s;


}



button:hover{

    transform:translateY(-3px);

}



button:active{

    transform:scale(.97);

}




.card{


    background:

    rgba(255,255,255,.9);


    padding:20px;


    border-radius:25px;


    margin-top:15px;


    box-shadow:

    0 15px 35px rgba(0,0,0,.2);


}



label{


    display:block;


    font-weight:bold;


    margin-top:12px;


    color:#444;


}




input,
select{


    width:100%;


    padding:14px;


    margin-top:6px;


    border:none;


    border-radius:12px;


    font-size:16px;


    background:white;


    box-shadow:

    inset 0 2px 5px rgba(0,0,0,.1);


    outline:none;


}




.result{


    background:

    rgba(255,255,255,.95);


    margin-top:20px;


    padding:15px;


    border-radius:25px;


    box-shadow:

    0 15px 35px rgba(0,0,0,.2);


    overflow:hidden;


}




.result h3{


    color:#333;


    font-size:22px;


    margin-top:0;


}





#returnList{


    width:100%;


    overflow-x:auto;


}




table{


    width:100%;


    border-collapse:collapse;


}



th{


    background:#667eea;


    color:white;


    padding:12px;


}



td{


    padding:10px;


    border-bottom:1px solid #ddd;


    font-size:14px;


}




#status{


    margin-top:10px;


    padding:12px;


    text-align:center;


    border-radius:12px;


    background:

    rgba(255,255,255,.8);


    font-weight:bold;


}



</style>


</head>


<body>


<button onclick="location.href='index.html'">

← HOME

</button>



<button onclick="downloadReturns()">

⬇ DOWNLOAD

</button>

<div id="status">
</div>


<div class="card">


<label>
DATE FROM
</label>

<input 
type="date"
id="dateFrom">



<label>
DATE TO
</label>

<input 
type="date"
id="dateTo">



<label>
COUNTER NO
</label>


<select id="counterNo">

<option value="">
ALL
</option>


<option value="1">
1
</option>


<option value="2">
2
</option>


<option value="3">
3
</option>


<option value="4">
4
</option>


<option value="5">
5
</option>


<option value="6">
6
</option>


<option value="7">
7
</option>


<option value="8">
8
</option>


<option value="9">
9
</option>


<option value="10">
10
</option>


</select>



<button onclick="searchReturns()">

SEARCH

</button>


</div>




<div class="result">


<h3>
RESULT
</h3>


<div id="returnList">

</div>


</div>



<script src="returns.js"></script>


</body>

</html>
