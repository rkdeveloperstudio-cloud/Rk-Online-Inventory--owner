<!DOCTYPE html>
<html>

<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Inventory System</title>
<link rel="manifest" href="./manifest.json">

<link rel="apple-touch-icon" href="./icon-192.PNG">

<meta name="theme-color" content="#1976d2">

<style>

/* =========================
   GLOBAL RESET
========================= */

*{

    margin:0;
    padding:0;
    box-sizing:border-box;

}


html,
body{

    width:100%;
    min-height:100%;

}


body{

    min-height:100dvh;

    font-family:
    "Segoe UI",
    Arial,
    sans-serif;


    background:

    linear-gradient(
        135deg,
        #667eea 0%,
        #764ba2 45%,
        #00c6ff 100%
    );


    overflow-x:hidden;

    color:white;

}



/* =========================
   MAIN APP CONTAINER
========================= */

.app{

    width:100%;

    min-height:100dvh;

    padding:20px;


}



/* =========================
   GLASS MAIN CARD
========================= */

.card{


    width:100%;


    max-width:700px;


    margin:auto;


    padding:30px;



    background:

    rgba(255,255,255,0.18);



    backdrop-filter:

    blur(20px);



    -webkit-backdrop-filter:

    blur(20px);



    border:

    1px solid rgba(255,255,255,0.35);



    border-radius:30px;



    box-shadow:


    0 25px 50px rgba(0,0,0,.25),


    inset 0 0 20px rgba(255,255,255,.15);



}



/* =========================
   HEADER
========================= */


h1,
h2,
h3{


    text-align:center;


    color:white;


    text-shadow:

    0 5px 15px rgba(0,0,0,.35);


}


h2{

    font-size:32px;

    margin-bottom:25px;

}



/* =========================
   GLASS MENU ITEMS
========================= */


.menu-list{

    margin-top:20px;

}




.menu-item{


    display:flex;


    align-items:center;


    gap:15px;



    padding:18px;



    margin-bottom:15px;



    border-radius:22px;




    background:


    rgba(255,255,255,0.20);




    backdrop-filter:

    blur(12px);



    -webkit-backdrop-filter:

    blur(12px);




    border:


    1px solid rgba(255,255,255,.30);




    box-shadow:


    0 10px 25px rgba(0,0,0,.15);



    cursor:pointer;



    transition:.3s;


}



.menu-item:hover{


    background:


    rgba(255,255,255,.35);



    transform:

    translateY(-3px);


}



.menu-item:active{


    transform:

    scale(.97);


}



/* =========================
   ICON
========================= */


.icon{


    width:45px;


    font-size:30px;


    text-align:center;


}



/* =========================
   TEXT
========================= */


.text{


    flex:1;


    color:white;


}



.text strong{


    display:block;


    font-size:18px;


}



.text span{


    display:block;


    margin-top:5px;


    font-size:13px;


    opacity:.85;


}



/* =========================
   ARROW
========================= */


.arrow{


    font-size:32px;


    opacity:.8;


}



/* =========================
   BUTTONS
========================= */


button{


    width:100%;


    padding:16px;


    margin:10px 0;



    border:none;



    border-radius:18px;




    color:white;



    font-size:17px;


    font-weight:bold;



    cursor:pointer;




    background:


    rgba(255,255,255,.20);




    backdrop-filter:

    blur(10px);




    border:


    1px solid rgba(255,255,255,.30);



    box-shadow:


    0 10px 20px rgba(0,0,0,.15);



    transition:.3s;


}



button:hover{


    background:


    rgba(255,255,255,.35);



}



button:active{


    transform:

    scale(.97);


}



/* =========================
   INPUTS
========================= */


input,
select,
textarea{


    width:100%;


    padding:14px;



    border-radius:15px;



    border:


    1px solid rgba(255,255,255,.35);



    background:


    rgba(255,255,255,.20);



    backdrop-filter:

    blur(10px);



    color:white;


    font-size:16px;


    outline:none;


}



input::placeholder{


    color:white;


    opacity:.7;


}



input:focus,
select:focus{


    background:

    rgba(255,255,255,.30);


}



/* =========================
   TABLE AREA
========================= */


.table-container{


    width:100%;


    overflow:auto;


    border-radius:20px;


}



table{


    width:100%;


    border-collapse:collapse;


    background:

    rgba(255,255,255,.15);


}



th{


    background:

    rgba(255,255,255,.30);


    padding:12px;


    color:white;


}



td{


    padding:12px;


    border-bottom:


    1px solid rgba(255,255,255,.2);


    color:white;


}



/* =========================
   FOOTER
========================= */


.footer{


    text-align:center;


    margin-top:25px;


    font-size:13px;


    opacity:.8;


}



/* =========================
   MOBILE
========================= */


@media(max-width:600px){


.app{


    padding:10px;


}



.card{


    padding:20px;


    border-radius:22px;


}



h2{


    font-size:26px;


}



.menu-item{


    padding:15px;


}



.icon{


    font-size:26px;


}



}


/* =========================
   LANDSCAPE MOBILE
========================= */


@media(max-height:500px)
and (orientation:landscape){


.app{


    padding:10px;


}



.card{


    max-width:100%;


}



}



</style>
</head>


<body>


<div class="container">


<div class="card">


<h2>
📦 RK Inventory
</h2>



<div class="menu-list">


<div class="menu-item"
onclick="location.href='./inventory.html'">

<div class="icon">
📦
</div>

<div class="text">
<strong>Inventory Search</strong>
<span>Search products and stock</span>
</div>

<div class="arrow">
›
</div>

</div>



<div class="menu-item"
onclick="location.href='./sales.html'">

<div class="icon">
📊
</div>

<div class="text">
<strong>Sales Summary</strong>
<span>View sales reports</span>
</div>

<div class="arrow">
›
</div>

</div>



<div class="menu-item"
onclick="location.href='./returns.html'">

<div class="icon">
↩️
</div>

<div class="text">
<strong>Return Sale Details</strong>
<span>Check returned items</span>
</div>

<div class="arrow">
›
</div>

</div>



<div class="menu-item"
onclick="location.href='./order-report.html'">

<div class="icon">
📋
</div>

<div class="text">
<strong>Order Report</strong>
<span>Generate reorder list</span>
</div>

<div class="arrow">
›
</div>

</div>


</div>



<div class="footer">
RK Inventory Management System
</div>


</div>


</div>



<script>
if ("serviceWorker" in navigator) {

    window.addEventListener("load", function () {

        navigator.serviceWorker.register("./service-worker.js")

        .then(() =>
            console.log("Service Worker registered")
        )

        .catch(err =>
            console.log("SW error:", err)
        );

    });

}
</script>


</body>
</html>
