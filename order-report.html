<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Order Report</title>


<link rel="manifest" href="./manifest.json">

<link rel="apple-touch-icon" href="./icon-192.PNG">

<meta name="theme-color" content="#667eea">



<style>

*{
    box-sizing:border-box;
}


body{

    margin:0;

    min-height:100vh;

    padding:15px;


    font-family:
    "Segoe UI",
    Arial,
    sans-serif;


    background:

    linear-gradient(
        135deg,
        #667eea,
        #764ba2,
        #1976d2
    );

}



.container{

    width:100%;

    max-width:1100px;

    margin:auto;

}



/* HEADER */

.header{

    background:
    rgba(255,255,255,.18);


    backdrop-filter:
    blur(15px);


    -webkit-backdrop-filter:
    blur(15px);


    padding:20px;


    border-radius:25px;


    color:white;


    text-align:center;


    box-shadow:

    0 20px 40px rgba(0,0,0,.25);


    border:

    1px solid rgba(255,255,255,.25);

}



.header h2{

    margin:0;

    font-size:30px;

}




.back{

    display:inline-block;


    margin-top:15px;


    padding:10px 25px;


    border-radius:25px;


    background:white;


    color:#667eea;


    text-decoration:none;


    font-weight:bold;

}




/* CARD */


.card{

    margin-top:20px;


    padding:20px;


    border-radius:25px;


    background:

    rgba(255,255,255,.92);


    box-shadow:

    0 15px 35px rgba(0,0,0,.20);


}




.row{

    display:flex;

    gap:15px;

    margin-bottom:15px;

}




.field{

    flex:1;

}




label{

    display:block;


    font-weight:bold;


    margin-bottom:6px;


    color:#333;

}




input,
select{


    width:100%;


    padding:12px;


    border-radius:12px;


    border:

    1px solid #ddd;


    font-size:15px;


}



input:focus{


    outline:none;


    border-color:#667eea;


    box-shadow:

    0 0 8px rgba(102,126,234,.5);

}





/* LOAD BUTTON */


.main-btn{


    width:100%;


    padding:16px;


    border:none;


    border-radius:18px;


    background:

    linear-gradient(
        135deg,
        #667eea,
        #764ba2
    );


    color:white;


    font-size:18px;


    font-weight:bold;


    cursor:pointer;


}





/* STATUS */


#reportStatus,
#countStatus{


    margin-top:15px;


    padding:12px;


    background:

    rgba(255,255,255,.9);


    border-radius:15px;


    text-align:center;


    font-weight:bold;


}





#loading{


    color:white;

    text-align:center;

}





/* TABLE CARD */


.table-title{

    display:flex;

    justify-content:space-between;

    align-items:center;

    margin-bottom:20px;

}




.share-btn{


    background:

    linear-gradient(
        135deg,
        #25D366,
        #128C7E
    );


    color:white;


    border:none;


    padding:12px 25px;


    border-radius:25px;


    font-weight:bold;


}




.table-container{

    margin-top:15px;

    max-height:500px;

    overflow-y:auto;

    overflow-x:hidden;

    border-radius:15px;

}


table{

    width:100%;

    table-layout:fixed;

    border-collapse:collapse;

    background:white;

}



th{


    background:#667eea;

    color:white;

    padding:10px;

    font-size:14px;

    position:sticky;

    top:0;

    z-index:2;

}



td{


    padding:10px;

    border-bottom:1px solid #eee;

    font-size:13px;

    word-wrap:break-word;

    overflow-wrap:break-word;

}



/* Column sizing */

th:nth-child(1),
td:nth-child(1){

    width:40px;

    text-align:center;

}



th:nth-child(2),
td:nth-child(2){

    width:20%;

}



th:nth-child(3),
td:nth-child(3){

    width:35%;

}



th:nth-child(4),
td:nth-child(4),
th:nth-child(5),
td:nth-child(5){

    width:12%;

    text-align:center;

}



th:nth-child(6),
td:nth-child(6){

    width:15%;

    text-align:center;

}



.reorder{

    width:60px;

    padding:6px;

}





/* MOBILE */


@media(max-width:700px){


    body{

        padding:10px;

    }



    .row{


        flex-direction:column;

    }



    .header h2{


        font-size:24px;

    }



    .card{


        padding:15px;

        border-radius:20px;

    }



    .table-title{


        flex-direction:column;


        gap:15px;


    }



    .share-btn{


        width:100%;

    }


}


/* SMALL MOBILE */

@media(max-width:450px){


    th,
    td{


        padding:8px;


        font-size:13px;

    }


}

</style>


</head>




<body>



    <div class="container">



        <div class="header">


            <h2>
                📋 Order Report
            </h2>


            <a href="index.html" class="back">
                ← Back
            </a>


        </div>






        <div class="card">



            <div class="row">


                <div class="field">

                    <label>
                        Purchase From
                    </label>

                    <input type="date" id="purchaseFrom">

                </div>



                <div class="field">

                    <label>
                        Purchase To
                    </label>

                    <input type="date" id="purchaseTo">

                </div>


            </div>





            <div class="row">


                <div class="field">

                    <label>
                        Sales From
                    </label>

                    <input type="date" id="salesFrom">

                </div>



                <div class="field">

                    <label>
                        Sales To
                    </label>

                    <input type="date" id="salesTo">

                </div>


            </div>






            <div class="row">


                <div class="field">

                    <label>
                        Supplier
                    </label>

                  <input
type="text"
id="supplierSearch"
list="supplierList"
placeholder="Search Supplier">

<datalist id="supplierList">

</datalist>


                </div>




                <div class="field">

                    <label>
                        Category
                    </label>

<input
type="text"
id="categorySearch"
list="categoryList"
placeholder="Search Category">

<datalist id="categoryList">

</datalist>


                </div>


            </div>






            <div class="row">


                <div class="field">

                    <label>
                        Minimum Sale Qty
                    </label>

                    <input type="number" id="minQty" value="0">


                </div>




                <div class="field">

                    <label>
                        Stock Less Than
                    </label>

                    <input type="number" id="stockFilter">


                </div>


            </div>





            <button class="main-btn" id="btnLoad">

                LOAD REPORT

            </button>


        </div>


<div id="reportStatus"
style="
margin-top:15px;
padding:12px;
background:#f5f5f5;
border-radius:10px;
text-align:center;
font-weight:bold;">
Ready
</div>


<div id="loading"
style="
display:none;
text-align:center;
padding:10px;
font-weight:bold;">
⏳ Processing...
</div>

<div id="errorMessage"
style="
display:none;
color:red;
text-align:center;
padding:10px;
font-weight:bold;">
</div>

<div id="countStatus">
    Loaded: 0 / 0
</div>

        <div class="card">


            <div class="table-title">

                <h3>
                    Products
                </h3>


                <button class="share-btn" id="btnPdf">
                    📄 Share PDF
                </button>


            </div>






            <div class="table-container">


                <table>


                    <thead>

                        <tr>

                            <th>
                                <input type="checkbox" id="selectAll">
                            </th>


                            <th>
                                Supplier
                            </th>


                            <th>
                                Description
                            </th>


                            <th>
                                Stock
                            </th>


                            <th>
                                Sold
                            </th>


                            <th>
                                Reorder
                            </th>


                        </tr>

                    </thead>



                    <tbody id="productTable">
                    </tbody>


                </table>


            </div>


        </div>



    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/3.0.1/jspdf.umd.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/5.0.2/jspdf.plugin.autotable.min.js"></script>

<script src="order-report.js"></script>

</body>

</html>
