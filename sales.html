<!DOCTYPE html>
<html>

<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Sales Summary</title>

<style>

*{
    box-sizing:border-box;
}


html,
body{

    width:100%;

    min-height:100%;

    margin:0;

}


html{

    background:
    linear-gradient(
        135deg,
        #667eea,
        #764ba2,
        #1976d2
    );

}


body{

    min-height:100dvh;

    overflow-x:hidden;

    overflow-y:auto;

    font-family:
    "Segoe UI",
    Arial,
    sans-serif;

    background:
    linear-gradient(
        135deg,
        #667eea,
        #764ba2,
        #1976d2
    );

}


/* HOME BUTTON */

button {

    width:100%;

    max-width:420px;

    padding:16px;

    margin-top:12px;


    border:none;

    border-radius:15px;


    font-size:18px;

    font-weight:bold;


    color:white;


    background:

    rgba(255,255,255,0.18);


    backdrop-filter:
    blur(10px);


    -webkit-backdrop-filter:
    blur(10px);


    border:

    1px solid rgba(255,255,255,0.25);


    cursor:pointer;


    transition:.3s;

}



button:hover{

    transform:
    translateY(-3px);


    background:

    rgba(255,255,255,0.30);


}




h2{

    color:white;

    font-size:32px;

    margin:25px 0;


    text-align:center;


    text-shadow:

    0 5px 15px rgba(0,0,0,.3);

}





.card {


    width:100%;

    max-width:420px;


    margin-top:20px;


    padding:25px;


    border-radius:25px;



    background:

    rgba(255,255,255,0.18);



    backdrop-filter:

    blur(15px);



    -webkit-backdrop-filter:

    blur(15px);



    border:

    1px solid rgba(255,255,255,.25);



    box-shadow:

    0 20px 40px rgba(0,0,0,.25);



    color:white;


}



.card div:first-child{


    font-size:20px;

    font-weight:bold;

    opacity:.9;


}





.amount {


    margin-top:15px;


    font-size:40px;


    font-weight:bold;


    color:white;



    text-align:center;



    text-shadow:

    0 5px 15px rgba(0,0,0,.3);



}




.small {


    margin-top:15px;


    text-align:center;


    color:white;


    opacity:.8;


    font-size:14px;


}




#loading{


    margin-top:20px;


    color:white;


    font-size:18px;


    font-weight:bold;


}





@media(max-width:600px){


    body{

        padding:15px;

    }


    h2{

        font-size:26px;

    }


    .amount{

        font-size:34px;

    }


}



</style>

</head>


<body>


<button onclick="location.href='index.html'">
← Home
</button>


<h2>
Sales Summary
</h2>


<div class="card">


<div>
Total Sales
</div>


<div id="salesAmount" class="amount">

0.00

</div>


<div id="updatedTime" class="small">

Last Updated : -

</div>


</div>


<button onclick="refreshSales()">

Refresh Sales

</button>


<div id="loading" style="display:none">

Loading...

</div>


<script src="sales.js"></script>


</body>

</html>
