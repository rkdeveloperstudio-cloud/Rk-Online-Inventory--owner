<!DOCTYPE html>
<html>

<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Inventory System</title>
<link rel="manifest" href="./manifest.json">

<link rel="apple-touch-icon" href="./icon-192.PNG">

<meta name="theme-color" content="#1976d2">

<style>

/* =========================
   GLOBAL
========================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    width:100%;
    min-height:100%;
}

body{
    min-height:100dvh;
    overflow-x:hidden;

    font-family:
    "Segoe UI",
    Arial,
    sans-serif;

    color:white;

    background:
    linear-gradient(
        135deg,
        #4f46e5 0%,
        #6d28d9 35%,
        #2563eb 70%,
        #06b6d4 100%
    );

    background-size:300% 300%;

    animation:
    gradientMove 12s ease infinite;
}

/* Animated gradient */

@keyframes gradientMove{

0%{
    background-position:0% 50%;
}

50%{
    background-position:100% 50%;
}

100%{
    background-position:0% 50%;
}

}

/* =========================
   PAGE CONTAINER
========================= */

.container{
    width:100%;
    min-height:100dvh;

    padding:15px;

    display:flex;
    justify-content:center;
    align-items:flex-start;
}

/* =========================
   GLASS CARD
========================= */

.card{

    width:100%;
    max-width:460px;

    margin:20px auto;

    padding:26px;

    background:
    rgba(255,255,255,.14);

    backdrop-filter:
    blur(22px);

    -webkit-backdrop-filter:
    blur(22px);

    border:
    1px solid rgba(255,255,255,.28);

    border-radius:28px;

    box-shadow:

        0 30px 60px rgba(0,0,0,.28),

        inset 0 1px 1px rgba(255,255,255,.35),

        inset 0 -1px 1px rgba(255,255,255,.08);
}

/* =========================
   TITLE
========================= */

h2{
    text-align:center;

    font-size:34px;
    font-weight:700;
    letter-spacing:.5px;

    margin-bottom:28px;

    color:white;

    text-shadow:
        0 4px 10px rgba(0,0,0,.25),
        0 0 20px rgba(255,255,255,.35);
}

/* =========================
   MENU LIST
========================= */

.menu-list{
    margin-top:10px;
}

/* =========================
   FLOATING GLASS ITEM
========================= */

.menu-item{

    display:flex;
    align-items:center;
    gap:15px;

    padding:18px;

    margin-bottom:15px;

    border-radius:22px;

    background:
    rgba(255,255,255,.12);

    backdrop-filter:
    blur(12px);

    -webkit-backdrop-filter:
    blur(12px);

    border:
    1px solid rgba(255,255,255,.22);

    box-shadow:

        0 10px 25px rgba(0,0,0,.18),

        inset 0 1px 1px rgba(255,255,255,.25);

    cursor:pointer;

    transition:
        transform .35s ease,
        background .35s ease,
        box-shadow .35s ease;

    animation:
        floating 4s ease-in-out infinite;
}

/* Floating animation */

@keyframes floating{

0%{
    transform:translateY(0);
}

50%{
    transform:translateY(-3px);
}

100%{
    transform:translateY(0);
}

}

/* Hover / Touch */

.menu-item:hover{

    transform:translateY(-6px);

    background:
    rgba(255,255,255,.22);

    box-shadow:

        0 20px 40px rgba(0,0,0,.25),

        0 0 22px rgba(102,126,234,.45);
}

.menu-item:active{
    transform:scale(.98);
}

/* =========================
   ICON
========================= */

.icon{

    width:48px;
    flex-shrink:0;

    text-align:center;

    font-size:30px;

    filter:
    drop-shadow(0 0 10px rgba(255,255,255,.55));
}

/* =========================
   TEXT
========================= */

.text{
    flex:1;
    color:white;
}

.text strong{
    display:block;
    font-size:17px;
    font-weight:600;
}

.text span{
    display:block;
    margin-top:4px;

    font-size:13px;
    line-height:1.4;

    color:rgba(255,255,255,.82);
}

/* =========================
   ARROW
========================= */

.arrow{

    flex-shrink:0;

    font-size:30px;
    font-weight:bold;

    color:white;

    text-shadow:
    0 0 10px rgba(255,255,255,.85);
}

/* =========================
   FOOTER
========================= */

.footer{

    margin-top:26px;

    text-align:center;

    font-size:13px;
    font-weight:500;

    color:rgba(255,255,255,.82);
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:600px){

.container{
    padding:12px;
}

.card{
    padding:20px;
    border-radius:22px;
}

h2{
    font-size:28px;
    margin-bottom:24px;
}

.menu-item{
    padding:15px;
    gap:12px;
}

.icon{
    width:42px;
    font-size:26px;
}

.text strong{
    font-size:16px;
}

.text span{
    font-size:12px;
}

.arrow{
    font-size:26px;
}

}

/* Landscape phones */

@media(max-height:520px) and (orientation:landscape){

.container{
    align-items:flex-start;
    padding:10px;
}

.card{
    margin:10px auto;
}

}

</style>

</head>


<body>


<div class="container">


<div class="card">


<h2>
📦 RK Inventory
</h2>



<div class="menu-list">


<div class="menu-item"
onclick="location.href='./inventory.html'">

<div class="icon">
🔎
</div>

<div class="text">
<strong>Inventory Search</strong>
<span>Search products and stock</span>
</div>

<div class="arrow">
›
</div>

</div>



<div class="menu-item"
onclick="location.href='./sales.html'">

<div class="icon">
📊
</div>

<div class="text">
<strong>Sales Summary</strong>
<span>View sales reports</span>
</div>

<div class="arrow">
›
</div>

</div>



<div class="menu-item"
onclick="location.href='./returns.html'">

<div class="icon">
↩️
</div>

<div class="text">
<strong>Return Sale Details</strong>
<span>Check returned items</span>
</div>

<div class="arrow">
›
</div>

</div>



<div class="menu-item"
onclick="location.href='./order-report.html'">

<div class="icon">
📋
</div>

<div class="text">
<strong>Order Report</strong>
<span>Generate reorder list</span>
</div>

<div class="arrow">
›
</div>

</div>

<div class="menu-item"
onclick="location.href='./pos.html'">

<div class="icon">
📠
</div>

<div class="text">
<strong>POS Billing</strong>
<span>Create sales invoices and print bills</span>
</div>

<div class="arrow">
›
</div>

</div>


</div>



<div class="footer">
RK Inventory Management System
</div>


</div>


</div>



<script>
if ("serviceWorker" in navigator) {

    window.addEventListener("load", function () {

        navigator.serviceWorker.register("./service-worker.js")

        .then(() =>
            console.log("Service Worker registered")
        )

        .catch(err =>
            console.log("SW error:", err)
        );

    });

}
</script>


</body>
</html>
