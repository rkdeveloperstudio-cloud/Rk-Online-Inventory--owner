<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Smart POS Billing</title>


<style>

html, body{

    touch-action: manipulation;

}

:root{

    --bg:#062f3a;

    --panel:rgba(255,255,255,0.10);

    --border:rgba(120,230,255,0.35);

    --text:#f8fafc;


    /* Primary */
    --cyan:#38bdf8;


    /* Success */
    --green:#22c55e;


    /* Accent */
    --purple:#a855f7;


    /* Danger */
    --red:#ef4444;


    /* New */
    --orange:#f97316;

    --blue:#2563eb;

}


*{

    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:"Segoe UI",Arial,sans-serif;

}



body{

    min-height:100vh;

    background:
    linear-gradient(
        135deg,
        #015454,
        #07374a,
        #015454
    );

    color:var(--text);

}


.pos-container{


    max-width:1400px;
    margin:auto;
    padding:20px;


}





.glass{

    background:
    linear-gradient(
        145deg,
        rgba(255,255,255,0.18),
        rgba(255,255,255,0.05)
    );

    border:1px solid rgba(255,255,255,0.25);

    backdrop-filter:blur(25px);
    -webkit-backdrop-filter:blur(25px);


    border-radius:25px;


    box-shadow:

    /* floating shadow */
    0 25px 60px rgba(0,0,0,0.45),

    /* bottom depth */
    0 10px 25px rgba(0,0,0,0.35),

    /* glass inner light */
    inset 0 1px 2px rgba(255,255,255,0.35),

    /* soft cyan reflection */
    inset 0 -20px 40px rgba(0,180,255,0.08);


    position:relative;

    overflow:hidden;

}


.glass::before{

    content:"";

    position:absolute;

    top:0;
    left:0;

    width:100%;
    height:50%;


    background:
    linear-gradient(
        to bottom,
        rgba(255,255,255,0.12),
        transparent
    );


    pointer-events:none;

}



.header{


    height:70px;

    display:flex;

    align-items:center;

    justify-content:center;

    margin-bottom:20px;


}

@media(max-width:600px){

.header{

    height:60px;

    margin-bottom:15px;

}

}

.header h1{

    font-size:38px;

    font-weight:800;

    letter-spacing:1px;

    background:
    linear-gradient(
        135deg,
        #ffffff,
        #67e8f9,
        #a78bfa
    );

    -webkit-background-clip:text;

    -webkit-text-fill-color:transparent;


    text-shadow:
    0 5px 20px rgba(103,232,249,.35);


    animation:
    titleGlow 2s ease-in-out infinite;

}



@keyframes titleGlow{

    0%{
        filter:drop-shadow(0 0 5px rgba(103,232,249,.3));
    }


    50%{
        filter:drop-shadow(0 0 20px rgba(167,139,250,.8));
    }


    100%{
        filter:drop-shadow(0 0 5px rgba(103,232,249,.3));
    }

}




.input-area{


    padding:20px;

    margin-bottom:20px;


}





.input-row{


    display:flex;

    gap:10px;

    margin-bottom:15px;


}





input{


    flex:1;

    height:50px;

    border-radius:15px;

    border:1px solid var(--border);

    background:rgba(0,0,0,.3);

    color:white;

    padding:0 15px;

    font-size:16px;

    outline:none;


}



input:focus{


    box-shadow:
    0 0 20px var(--cyan);


}





button{


    border:none;

    border-radius:15px;

    padding:0 20px;

    color:white;

    cursor:pointer;

    font-weight:bold;

    transition:.3s;


}




button:hover{


    transform:translateY(-3px);

}





.enter-btn{


    background:
    linear-gradient(135deg,var(--purple),var(--cyan));

    box-shadow:
    0 0 20px var(--cyan);

}




.scan-btn{

    background:
    linear-gradient(135deg,var(--green),var(--cyan));

}




.search-btn{

    background:
    linear-gradient(135deg,var(--orange),var(--red));

}





.main{

display:flex;

flex-direction:column;

gap:20px;

}





.section{


    padding:20px;


}





.section h2{


    margin-bottom:15px;

    color:var(--cyan);


}







.results{


    min-height:350px;


}




.product{


    display:flex;

    justify-content:space-between;

    align-items:center;

    padding:15px;

    margin-bottom:10px;

    background:
    rgba(255,255,255,.08);


    border-radius:15px;


}





.product button{


    height:35px;

    background:var(--green);

    color:black;


}








.cart{

width:100%;

}



.cart-header,
.cart-row{


    display:grid;

    grid-template-columns:

    2fr .7fr .8fr .8fr;


    padding:12px;

    align-items:center;


}



.cart-header{


    color:var(--cyan);

    border-bottom:

    1px solid var(--border);


}




.cart-row{


    background:

    rgba(255,255,255,.06);

    margin-top:8px;

    border-radius:12px;


}




.qty-control{

    display:flex;

    align-items:center;

    justify-content:center;

    gap:6px;

}


.qty-control button{

    width:32px;

    height:32px;

    padding:0;

    display:flex;

    align-items:center;

    justify-content:center;

    font-size:18px;

    background:var(--purple);

    border-radius:8px;

}


.qty-number{

    min-width:25px;

    text-align:center;

    font-weight:bold;

    font-size:16px;

}




.total-box{


    margin-top:20px;

    padding:15px;


}




.total-line{


    display:flex;

    justify-content:space-between;

    padding:8px;


}




.grand{


    font-size:24px;

    color:var(--green);

    text-shadow:

    0 0 15px var(--green);


}







.actions{


    display:flex;

    gap:15px;

    margin-top:20px;


}




.save{


    flex:1;

    height:55px;

    background:

    linear-gradient(135deg,#00ff9d,#00aaff);


}





.print{


    flex:1;

    height:55px;

    background:

    linear-gradient(135deg,var(--purple),var(--cyan));


}






.bottom-actions{

    display:flex;

    gap:15px;

    margin-top:20px;

}


.bottom-actions button{

    height:50px;

    flex:1;

    background:

    linear-gradient(
        135deg,
        rgba(99,102,241,.25),
        rgba(34,211,238,.25)
    );


    border:

    1px solid rgba(255,255,255,.25);


    backdrop-filter:blur(10px);


    color:white;


    font-size:15px;

}


@media(max-width:600px){

.bottom-actions{

}


.bottom-actions button{

}

}

.pos-toast{

    position:fixed;

<div id="scannerModal" class="scanner-modal">

    <div class="scanner-box glass">

        <h2>Scan Barcode</h2>

        <video id="scannerVideo"></video>

        <button id="closeScanner">
            CLOSE
        </button>

    </div>

</div>


<div id="oldBillsPanel" class="scanner-modal">
    <div class="scanner-box glass">

        <h2>Search Old Bills</h2>

        <input id="oldInvoiceSearch" placeholder="Invoice No">

        <input type="date" id="billFromDate">

        <input type="date" id="billToDate">

        <input type="number" id="amountFrom" placeholder="Amount From">

        <input type="number" id="amountTo" placeholder="Amount To">

        <button id="findOldBillBtn">SEARCH</button>

        <button id="closeOldBills">CLOSE</button>

    </div>
</div>


<!-- OLD BILL RESULT PAGE -->

<div id="oldBillResultPage" class="scanner-modal">

    <div class="scanner-box glass">

        <h2>Select Bill</h2>

        <div id="oldBillResults"></div>

        <button id="closeResultPage">
            CLOSE
        </button>

    </div>

</div>
